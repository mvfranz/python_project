[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modplus"
version = "0.1.0"
description = "Modula+ : a strongly-typed, Modula-2-lineage systems language with C++-style templates, zero-cost generics, and manual memory management, compiled to native code via LLVM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mvfranz" }]
keywords = ["compiler", "llvm", "llvmlite", "modula-2", "programming-language", "templates", "generics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Compilers",
]
dependencies = [
  "llvmlite>=0.44",
]

[project.urls]
Homepage = "https://github.com/mvfranz/python_project/"

[project.scripts]
modplusc = "modplus.cli:main"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "coverage",
  "ruff",
  "mypy",
  "mkdocs",
  "gitchangelog",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modplus = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
